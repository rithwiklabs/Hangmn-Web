<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Title -->
    <div class="title">
        <h1>Hangman Web</h1>
    </div>
    <!-- Main Container -->
    <div class="container">
        <!-- Left Panel -->
        <div class="left">
            <div class="hangman">
                <div class="base"></div>
                <div class="pole"></div>
                <div class="beam"></div>
                <div class="rope"></div>

                <div class="head"></div>
                <div class="body"></div>
                <div class="left-arm"></div>
                <div class="right-arm"></div>
                <div class="left-leg"></div>
                <div class="right-leg"></div>
            </div>
        </div>
        <!-- Right Panel -->
        <div class="right">
            <div class="category">
                <h3>Category</h3>
                <p id="category"></p>
            </div>
            <!-- Word To Be Guessed -->
            <div class="word">
                <h2 id="word"></h2>
            </div>
            <!-- Number of Attempts Left -->
            <div class="stats">
                <p>Wrong Guesses : <span id="wrong-guesses">0</span>/6</p>
                <p>Attempts Left: <span id="attempts-left">6</span></p>
            </div>
            <div class="status">
                <p id="status">Click <b>New Game</b> to Start</p>
            </div>
        </div>
    </div>
    <!-- New Game Button -->
    <div class="game">
        <button id="new-game">New Game</button>
    </div>
    <!-- Footer -->
    <footer>
        <p><b>&copy; All Rights Reserved</b></p>
    </footer>
    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/controller.js"></script>
</body>

</html>
